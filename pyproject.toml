[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpbridge"
version = "0.2.0"
description = "Multilingual NL to validated operation plans: Python orchestration, Rust native kernels"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]
license = "MIT"

[project.optional-dependencies]
numpy = ["numpy>=1.26,<3"]
models = ["sentence-transformers[onnx]>=3,<6"]
onnx = ["onnxruntime==1.24.4", "tokenizers==0.22.2", "onnx>=1.17,<2", "numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/autogrammar/nlpbridge"

[project.scripts]
nlpbridge = "nlbridge.cli:main"
nlbridge = "nlbridge.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = [".", "python"]
addopts = "-p wellmanifest_governance"

[tool.wellmanifest]
standard = "0.20.162"
revision = "8e6b51dc91a2ac7e1e771908e0fac5e12da0b9a0"
gate = "project/governance-check.sh"
