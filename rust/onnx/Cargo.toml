[package]
name = "nlbridge-onnx"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "nlbridge_onnx"
crate-type = ["cdylib", "rlib"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
